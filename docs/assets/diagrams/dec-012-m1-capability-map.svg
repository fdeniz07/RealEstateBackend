  <rect x="50" y="55" width="200" height="200" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="150" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Core M1 (evidence)</text>
  <text x="65" y="110" font-family="Segoe UI, sans-serif" font-size="11">A01-style list AS-IS partial</text>
  <text x="65" y="132" font-family="Segoe UI, sans-serif" font-size="11">getListWithActive exists</text>
  <text x="65" y="154" font-family="Segoe UI, sans-serif" font-size="11">A07 slug  -  missing TASK-014</text>
