<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
  <title id="title">RE-FIG-DEC-012-M1  -  M1 browse capability map</title>
  <desc id="desc">Validated minimal journey vs optional A02 A03 A04 enhancements</desc>
  <rect width="780" height="300" fill="#f8fafc"/>
