  <text x="630" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Optional A04 popular</text>
  <text x="545" y="115" font-family="Segoe UI, sans-serif" font-size="11">Home marketing strip</text>
  <text x="545" y="140" font-family="Segoe UI, sans-serif" font-size="11">Needs PP + tour data</text>
  <text x="545" y="175" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">TASK-002 dependency risk</text>
  <text x="390" y="278" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Non-binding map  -  PO selects M1 scope</text>
