  <rect x="24" y="60" width="110" height="56" rx="8" fill="#0B1F3A"/><text x="79" y="92" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11">Register / login</text>
  <rect x="154" y="60" width="110" height="56" rx="8" fill="#FFFFFF" stroke="#0B1F3A"/><text x="209" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">Browse listings</text>
