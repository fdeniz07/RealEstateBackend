  <rect x="414" y="60" width="110" height="56" rx="8" fill="#FFFFFF" stroke="#0B1F3A"/><text x="469" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">Tour request</text>
  <rect x="544" y="60" width="110" height="56" rx="8" fill="#14B8A6"/><text x="599" y="92" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="11">Publish advert</text>
