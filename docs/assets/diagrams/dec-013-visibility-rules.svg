<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">RE-FIG-DEC-013-VIS  -  Listing visibility rule alternatives</title>
  <desc id="desc">isActive vs AdvertStatus for public catalog queries</desc>
  <rect width="720" height="340" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Public Visibility Rule Alternatives (DEC-013)</text>
  <rect x="40" y="55" width="150" height="100" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="115" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">A isActive</text>
  <text x="115" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9">AS-IS query</text>
  <text x="115" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">Pending may show</text>
  <rect x="210" y="55" width="150" height="100" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="285" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">B ACTIVATED</text>
  <text x="285" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">LEGACY intent</text>
  <rect x="380" y="55" width="150" height="100" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="455" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">C both</text>
  <text x="455" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">PROPOSAL safest</text>
  <rect x="550" y="55" width="140" height="100" rx="6" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="620" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">D Other</text>
  <text x="620" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">PO TBD</text>
  <text x="360" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">Repository: findAllActive uses isActive only (verified)</text>
  <text x="360" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">advertStatus not filtered in AS-IS public list candidate</text>
  <text x="360" y="310" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">Coordinate with DEC-006  -  not approved here</text>
</svg>
