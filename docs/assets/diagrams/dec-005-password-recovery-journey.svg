<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">RE-FIG-DEC-006  -  Password recovery journey</title>
  <desc id="desc">Proposed F03 forgot and F04 reset flow with anti-enumeration</desc>
  <rect width="800" height="200" fill="#f8fafc"/>
  <text x="400" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Password Recovery Journey (DEC-005  -  proposal)</text>
  <rect x="30" y="60" width="110" height="56" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="85" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">1. Enter email</text>
  <rect x="170" y="60" width="120" height="56" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="230" y="85" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">2. F03</text>
  <text x="230" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">generic OK</text>
  <rect x="320" y="60" width="120" height="56" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="380" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">3. Email link</text>
  <rect x="470" y="60" width="120" height="56" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="530" y="85" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">4. F04 reset</text>
  <text x="530" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">new password</text>
  <rect x="620" y="60" width="110" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="675" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">5. Login F01</text>
  <line x1="140" y1="88" x2="170" y2="88" stroke="#475569" marker-end="url(#m)"/>
  <line x1="290" y1="88" x2="320" y2="88" stroke="#475569" marker-end="url(#m)"/>
  <line x1="440" y1="88" x2="470" y2="88" stroke="#475569" marker-end="url(#m)"/>
  <line x1="590" y1="88" x2="620" y2="88" stroke="#475569" marker-end="url(#m)"/>
  <text x="400" y="165" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">LEG-NFR-008: no email existence leak · TOKEN lifecycle TBD · TASK-017</text>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
