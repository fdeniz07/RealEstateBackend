<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">RE-FIG-DEC-015-003 - Listing to detail flow</title>
  <desc id="desc">Guest journey with slug navigation</desc>
  <rect width="720" height="260" fill="#f8fafc"/>
  <text x="360" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">M1 browse flow - target design</text>
  <rect x="40" y="55" width="90" height="44" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="85" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">Guest</text>
  <rect x="160" y="50" width="140" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">GET catalog</text>
  <text x="230" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="8">page, sort</text>
  <rect x="330" y="50" width="120" height="54" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="390" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">Pick slug</text>
  <rect x="480" y="50" width="160" height="54" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="560" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">GET slug detail</text>
  <text x="560" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="8">PublicAdvertDetail</text>
  <line x1="130" y1="77" x2="160" y2="77" stroke="#475569" marker-end="url(#m)"/>
  <line x1="300" y1="77" x2="330" y2="77" stroke="#475569" marker-end="url(#m)"/>
  <line x1="450" y1="77" x2="480" y2="77" stroke="#475569" marker-end="url(#m)"/>
  <rect x="100" y="140" width="520" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="360" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">Visibility gate runs before mapper (DEC-006 rule TBD)</text>
  <text x="360" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">List and detail must use same eligibility rule to avoid orphan list cards</text>
  <text x="360" y="216" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Product: anonymous required (DEC-001-ANONYMOUS-CATALOG)</text>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
