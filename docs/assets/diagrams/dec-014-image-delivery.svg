<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">RE-FIG-DEC-014-004  -  Image delivery alternatives</title>
  <desc id="desc">Four models for property image access</desc>
  <rect width="720" height="300" fill="#f8fafc"/>
  <text x="360" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Property image delivery models (alternatives  -  not approved)</text>
  <rect x="30" y="50" width="150" height="120" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="105" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">1 Direct URL</text>
  <text x="105" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">Image.path in JSON</text>
  <text x="105" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">Browser fetches path</text>
  <text x="105" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#b45309">AS-IS: path stored;</text>
  <text x="105" y="162" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#b45309">no property GET API</text>
  <rect x="200" y="50" width="150" height="120" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="275" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">2 App endpoint</text>
  <text x="275" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">GET /public/images/{id}</text>
  <text x="275" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">Checks listing visibility</text>
  <rect x="370" y="50" width="150" height="120" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="445" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">3 Protected</text>
  <text x="445" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">JWT or signed URL</text>
  <text x="445" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">Conflicts anon catalog</text>
  <rect x="540" y="50" width="150" height="120" rx="6" fill="#fff" stroke="#64748b"/>
  <text x="615" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">4 CDN / object</text>
  <text x="615" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">Future option</text>
  <text x="615" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8">Cache headers TBD</text>
  <rect x="80" y="200" width="560" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="360" y="225" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">AS-IS: ImageController empty; ImageManager has repository only; profile-image GET permitAll (stub)</text>
  <text x="360" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Unpublished advert images: no enforcement logic found  -  PO policy required</text>
</svg>
