<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">RE-FIG-DEC-007-LAY  -  Three i18n layers</title>
  <desc id="desc">UI i18next vs API friendly messages vs property content single column</desc>
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Localization Layers (DEC-007)</text>
  <rect x="50" y="60" width="190" height="200" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="145" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">UI (Frontend)</text>
  <text x="65" y="120" font-family="Segoe UI, sans-serif" font-size="11">i18next en/tr/de</text>
  <text x="65" y="142" font-family="Segoe UI, sans-serif" font-size="11">SRC-012 verified</text>
  <text x="65" y="175" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Labels, menus, static text</text>
  <rect x="265" y="60" width="190" height="200" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">API messages</text>
  <text x="280" y="120" font-family="Segoe UI, sans-serif" font-size="11">{language} path param</text>
  <text x="280" y="142" font-family="Segoe UI, sans-serif" font-size="11">FriendlyMessageUtils</text>
  <text x="280" y="175" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Errors and success titles</text>
  <rect x="480" y="60" width="190" height="200" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="575" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Property content</text>
  <text x="495" y="120" font-family="Segoe UI, sans-serif" font-size="11">Advert.title / desc</text>
  <text x="495" y="142" font-family="Segoe UI, sans-serif" font-size="11">Single column AS-IS</text>
  <text x="495" y="175" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Schema PO DECISION REQUIRED</text>
  <text x="360" y="290" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Changing API language does not translate listing text today</text>
</svg>
