<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">RE-FIG-DEC-015-005 - Image delivery M1 recommendation</title>
  <desc id="desc">Model 2 app endpoint vs direct path</desc>
  <rect width="720" height="220" fill="#f8fafc"/>
