<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">RealEstate system context</title>
  <desc id="desc">Property seekers and customers use the web client; backend persists to PostgreSQL</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#F1F5F9"/>
  <text x="380" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#0B1F3A">System Context (C4 Level 1)</text>
  <rect x="30" y="70" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#64748B"/>
  <text x="95" y="97" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">Seekers and sellers</text>
  <rect x="30" y="260" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#0B1F3A"/>
  <text x="105" y="282" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Web client</text>
  <text x="105" y="298" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748B">React SPA (AS-IS)</text>
  <rect x="285" y="155" width="190" height="80" rx="10" fill="#0B1F3A" stroke="#14B8A6" stroke-width="2"/>
  <text x="380" y="188" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">RealEstate Backend</text>
  <text x="380" y="208" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10">Spring Boot API</text>
  <rect x="580" y="165" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#64748B"/>
  <text x="655" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12">PostgreSQL</text>
  <line x1="180" y1="286" x2="285" y2="210" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="255" font-family="Segoe UI, sans-serif" font-size="10" fill="#0F766E">HTTPS / JWT</text>
  <line x1="475" y1="195" x2="580" y2="195" stroke="#475569" marker-end="url(#arrow)"/>
  <text x="520" y="182" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">JDBC / Flyway</text>
  <line x1="95" y1="114" x2="320" y2="165" stroke="#94A3B8" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <rect x="200" y="320" width="360" height="56" rx="6" fill="#E0F2F1" stroke="#14B8A6"/>
  <text x="380" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#134E4A">TO-BE (not implemented): BFF + OIDC (Keycloak) - see SAD-001</text>
  <text x="380" y="362" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748B">Diagram reflects AS-IS direct browser-to-API path</text>
</svg>