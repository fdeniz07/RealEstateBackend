<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">Real Estate Workspace - three repositories</title>
  <desc id="desc">Consumer Backend and Frontend repositories with AIOS as engineering governance, not a runtime service</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#F1F5F9"/>
  <text x="440" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#0B1F3A">Real Estate Engineering Workspace</text>
  <text x="440" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748B">Three independent Git repositories | coordinated product delivery</text>
  <rect x="40" y="88" width="800" height="96" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="440" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#334155">AIOS - Engineering governance (not a runtime service)</text>
  <text x="80" y="148" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Governance | Methodologies | Workflows | Validation | Repository guidance</text>
  <text x="80" y="168" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748B" font-style="italic">Optional synced rules (e.g. .agents/) may inform agents; ADRs and code stay in Consumer repos</text>
  <rect x="40" y="220" width="380" height="260" rx="12" fill="#0B1F3A" stroke="#14B8A6" stroke-width="2"/>
  <text x="230" y="252" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">RealEstateBackend</text>
  <text x="60" y="282" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8">Consumer repository | owns API and data</text>
  <text x="60" y="312" font-family="Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">- Business domain and application logic</text>
  <text x="60" y="334" font-family="Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">- REST API (api/v1.0)</text>
  <text x="60" y="356" font-family="Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">- JPA / PostgreSQL / Flyway</text>
  <text x="60" y="378" font-family="Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">- JWT security / OpenAPI</text>
  <text x="60" y="410" font-family="Segoe UI, sans-serif" font-size="10" fill="#14B8A6">Spring Boot | Modular monolith (TO-BE)</text>
  <rect x="460" y="220" width="380" height="260" rx="12" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/>
  <text x="650" y="252" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0B1F3A">RealEstate_Frontend</text>
  <text x="480" y="282" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748B">Consumer repository | owns UX</text>
  <text x="480" y="312" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">- User interface (React SPA)</text>
  <text x="480" y="334" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">- Application routing</text>
  <text x="480" y="356" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">- State management (Redux)</text>
  <text x="480" y="378" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">- API integration (axios)</text>
  <text x="480" y="410" font-family="Segoe UI, sans-serif" font-size="10" fill="#14B8A6">CRA | i18next (en/tr/de)</text>
  <line x1="230" y1="184" x2="230" y2="218" stroke="#64748B" stroke-dasharray="4" marker-end="url(#arr)"/>
  <line x1="650" y1="184" x2="650" y2="218" stroke="#64748B" stroke-dasharray="4" marker-end="url(#arr)"/>
  <text x="230" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748B">optional guidance</text>
  <text x="650" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748B">optional guidance</text>
  <line x1="420" y1="350" x2="460" y2="350" stroke="#14B8A6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="440" y="338" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#0F766E">HTTPS / JWT (AS-IS)</text>
</svg>