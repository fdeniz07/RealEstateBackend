spring:
  application:
    name: RealEstate
  profiles:
    active: localhost
  main:
    allow-bean-definition-overriding: true
info:
  component: Real Estate

---
server:
  port: 8080
  error:
    include-binding-errors: always
    include-message: always
    include-stacktrace: never

cors:
  allowed-origins: "*" ## Tüm kaynaklara izin veriliyor
  allowed-methods: "*" ## Bütün HTTP metodlarina izin verildi
  allowed-headers: "*" ## Tüm header'lara izin verilecegini söyledik
  exposed-headers: "*"

#aws:
#  region: eu-west-1
#  s3:
#    mock: true
#    buckets:
#      customer: fs-prettier-customer-test

#management:
#  endpoints:
#    web:
#      exposure:
#        include: "realestate,info"

logging:
  level:
    root:
    com.prettier: DEBUG
---
spring:
  config:
    activate:
      on-profile: localhost
  cloud:
    config:
      uri: http://localhost:8080
  flyway:
    enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
#    database-platform: org.hibernate.dialect.PostgreSQLDialect # Hibernate PostgreSQL dialect'ini otomatik belirleyebiliyor.
    properties:
      hibernate:
#        default_schema: real_estate_db
        format_sql: true
    open-in-view: true
  datasource:
    # Canonical: SPRING_DATASOURCE_* (see docs/04-development/LOCAL_ENV.md).
    # Legacy fallbacks below apply only to profile localhost when canonical vars are unset (Compose .env).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5433}/${POSTGRES_DB:real_estate_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:db_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  security:
    user:
      name: test
      password: test123
#  main:
#    web-application-type: servlet
#  servlet:
#    multipart:
#      max-file-size: 10MB
#      max-request-size: 10MB
#  codec:
#    max-in-memory-size: 10MB

prettier:
  openapi:
    dev-url: http://localhost:8080
    prod-url: https://prettier.com

#    Swagger arayüzü : http://localhost:8080/swagger-ui/index.html

backendapi:
  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpressionMS: 86400000